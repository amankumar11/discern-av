[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[project]
name = "discern-av"
version = "0.1.0"
description = "Cause-attributed trust for multimodal autonomous-vehicle perception"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "DISCERN-AV contributors" }]
dependencies = [
  "hydra-core==1.3.2",
  "mlflow==2.17.2",
  "omegaconf==2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
  "ruff==0.7.4",
]

[project.scripts]
discern = "discern.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["discern"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "gpu: requires an NVIDIA GPU and compiled CUDA dependencies",
  "integration: exercises external data or frameworks",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["PLAN.md"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"


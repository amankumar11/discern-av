name: stage0-checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  laptop-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: make check
